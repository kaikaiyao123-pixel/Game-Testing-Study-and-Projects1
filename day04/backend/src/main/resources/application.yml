server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: blog-backend
  datasource:
    # 容器内用服务名 mysql，本机用 localhost（由 MYSQL_HOST 覆盖）
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USER:blog}
    password: ${MYSQL_PASSWORD:blog_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
      initialization-fail-timeout: 60000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s
  jackson:
    default-property-inclusion: non_null

blog:
  cors:
    # 开发默认放开；生产请设为具体前端域名
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  session:
    ttl-seconds: ${SESSION_TTL_SECONDS:604800}
    key-prefix: "blog:session:"
  security:
    login-max-fails: ${LOGIN_MAX_FAILS:5}
    lock-seconds: ${LOGIN_LOCK_SECONDS:60}
