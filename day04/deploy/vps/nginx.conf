# nginx 反向代理配置（路径 B）
#
# 设计：浏览器只访问 443；nginx 终止 TLS 后把所有请求（含 /api，因为 frontend
# 容器内已同源反代到 backend:8081）转发到 frontend:3000。mysql/redis 不发布公网。
#
# 使用前：
#   1. 把证书放到 deploy/vps/certs/fullchain.pem 与 deploy/vps/certs/privkey.pem
#      （Let's Encrypt: certbot certonly --webroot 或 --nginx；自签仅测试用）。
#   2. 把下面 server_name 改成你的域名；HTTP 80 强制跳转 HTTPS。
#   3. 若前端容器名不是 frontend，同步修改 upstream。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;   # 允许上传/代理较大资源（首屏视频等）

    upstream blog_frontend {
        server frontend:3000;
        keepalive 32;
    }

    # HTTP → HTTPS 强制跳转
    server {
        listen 80;
        server_name _;
        # Let's Encrypt 校验目录（使用 webroot 申请时放开）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;   # 改成你的域名，如 blog.example.com

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 基础安全响应头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location / {
            proxy_pass http://blog_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }
}
